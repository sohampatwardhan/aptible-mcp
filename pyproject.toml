[dependency-groups]
dev = [
  "ipython>=9.4.0",
  "ruff>=0.12.4,<0.13",
  "toml-sort>=0.24.2",
  "mypy>=1.17.0,<2",
  "pip-audit>=2.9.0",
  "types-requests>=2.32.4.20250611",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pyyaml>=6.0.2",
  "rust-just>=1.42.3"
]

[project]
name = "aptible-mcp"
version = "0.2.2"
description = "MCP server for Aptible"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "mcp[cli]>=1.28.1,<2",
  "httpx>=0.28.1",
  "requests>=2.34.2",
  "pydantic>=2.6.0",
  # pydantic-settings 2.15 exposes an unresolved FastMCP Settings forward ref.
  "pydantic-settings>=2.5.2,<2.15",
  "pyjwt>=2.13.0",
  "cryptography>=50.0.0"
]

[tool.ruff]
extend-exclude = [".agents"]
